<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - Chalermchaichan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/AnimationLoading.css">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
    }

    /* Navbar Global Style */
    .navbar {
      background: #fff;
      transition: all 0.3s;
      padding-top: 1rem;
      /* ระยะด้านบน */
      padding-bottom: 1rem;
      /* ระยะด้านล่าง */
      font-size: 1.1rem;
      /* ขนาดตัวอักษร */
    }

    .navbar-brand {
      color: #c62828 !important;
      font-weight: bold;
      font-size: 1.6rem;
      /* โลโก้ใหญ่ขึ้น */
    }

    .nav-link {
      position: relative;
      margin-left: 20px;
      font-weight: 500;
      color: #333 !important;
      font-size: 1.1rem;
      /* ขยายตัวอักษรเมนู */
      padding: 0.75rem 1rem;
      /* เพิ่มพื้นที่รอบตัวอักษร */
    }

    .nav-link::after {
      content: '';
      position: absolute;
      width: 0%;
      height: 2px;
      bottom: -5px;
      left: 0;
      background: linear-gradient(90deg, #c62828, #fbc02d);
      transition: width 0.3s;
    }

    .nav-link:hover {
      color: #c62828 !important;
    }

    .nav-link:hover::after {
      width: 100%;
    }

    /* Active menu highlight */
    .nav-link.active {
      color: #c62828 !important;
      font-weight: bold;
      border-bottom: 2px solid #c62828;
    }


    .hero {
      height: 100vh;
      background: linear-gradient(-45deg, #c62828, #fbc02d, #ff7043, #29b6f6);
      background-size: 400% 400%;
      animation: gradientMove 12s ease infinite;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #fff;
      padding: 0 20px;
    }

    @keyframes gradientMove {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .hero h2 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

    .hero p {
      max-width: 600px;
      margin-bottom: 30px;
    }

    .hero .btn {
      background: #fff;
      color: #c62828;
      border-radius: 25px;
      padding: 10px 25px;
      transition: all 0.3s;
    }

    .hero .btn:hover {
      background: #29b6f6;
      color: #fff;
      transform: scale(1.1);
    }

    .section {
      padding: 60px 30px;
      text-align: center;
    }

    .section h1 {
      color: #c62828;
      margin-bottom: 30px;
    }

    .product-card {
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 20px;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 6px 20px rgba(198, 40, 40, 0.4);
    }

    .product-card h4 {
      color: #c62828;
    }

    footer {
      background: #111;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>
  <!-- Loading Overlay -->
  <div id="loading">
    <span>🚀 Loading...</span>
  </div>
  <!-- Navbar -->
<nav class="navbar navbar-expand-lg fixed-top shadow-sm">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="IMG/favicon.ico" alt="Logo" width="20%" height="20%" class="me-2">
      <span class="fw-bold">Rocket</span>
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
        <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="manufacturing.html">Manufacturing</a></li>
        <li class="nav-item"><a class="nav-link" href="pdpa.html">PDPA</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>



  <!-- Footer -->
  <footer>
    copyright © 2026<br> chalermchaichan.co.th<br> all rights reserve
  </footer>

  <script src="js/AnimationLoading.js"></script>
</body>

</html>
